version: 3

tasks:

  # composers

  compose:
    cmd: docker compose --env-file ./config/.env.docker up -d --build

  compose:core:
    cmd: docker compose --env-file ./config/.env.docker up -d --build core

  compose:tg:
    cmd: docker compose --env-file ./config/.env.docker up -d --build tg

  compose:ui:
    cmd: docker compose --env-file ./config/.env.docker up -d --build ui

  # loggers

  logs:
    cmd: docker compose --env-file ./config/.env.docker logs -t -f --tail=100

  logs:core:
    cmd: docker compose --env-file ./config/.env.docker logs -t -f --tail=100 core

  logs:tg:
    cmd: docker compose --env-file ./config/.env.docker logs -t -f --tail=100 tg

  logs:ui:
    cmd: docker compose --env-file ./config/.env.docker logs -t -f --tail=100 ui

  # runners

  run:
    deps: [run:core, run:tg, run:ui]

  run:core:
    dir: "./core"
    cmd: CONFIG_FILE="../config/core.dev.config.yaml" ENV_FILE="../config/.env.core" go run ./cmd/core

  run:tg:
    dir: "./tg"
    cmd: ENV_FILE="../config/.env.tg.dev" CONFIG_FILE="../config/tg.dev.config.yaml" python main.py

  run:ui:
    dir: "./ui"
    cmd: CONFIG_PATH="../config" MODE="ui.dev" npm run dev

  run:admin:
    dir: "./admin"
    cmd: CONFIG_PATH="../config" MODE="admin.dev" npm run dev
