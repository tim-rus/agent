networks:
  agent_net:
    driver: bridge

services:

  core:
    env_file:
      - ./config/.env.core
    build:
      context: .
      dockerfile: docker/core.Dockerfile
    container_name: core
    ports:
      - 90:9000
    volumes:
      - ${CONFIG_PATH}:${APP_CONFIG_PATH}:ro
    environment:
      CONFIG_FILE: ${APP_CONFIG_PATH}/core.config.yaml
      ENV_FILE: ${APP_CONFIG_PATH}/.env.core
    networks:
      - agent_net
    # restart: unless-stopped

  tg:
      env_file:
        - ./config/.env.tg
      build:
        context: .
        dockerfile: docker/tg.Dockerfile
      container_name: tg
      volumes:
        - ${CONFIG_PATH}:${APP_CONFIG_PATH}:ro
      environment:
        ENV_FILE: "${APP_CONFIG_PATH}/.env.tg"
        CONFIG_FILE: "${APP_CONFIG_PATH}/tg.config.yaml"
      networks:
        - agent_net
      # restart: unless-stopped
